name: Checks
on:
    push:
        branches: [main]
        paths-ignore: ['public/data/**']
    pull_request:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm test
            - run: npm run build
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e
