name: Update daily timetables
on:
    schedule:
        - cron: '30 20 * * *'
    workflow_dispatch:
        inputs:
            force_refresh:
                description: '強制重新取得所有日期班表（增加 TDX 用量）'
                type: boolean
                default: false
permissions:
    contents: write
    pages: write
    id-token: write
concurrency:
    group: timetable-update
    cancel-in-progress: false
jobs:
    update:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        outputs:
            saved: ${{ steps.save.outputs.saved }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm test
            - name: Fetch official timetables
              id: fetch
              continue-on-error: true
              run: npm run data:generate
              env:
                  FORCE_REFRESH: ${{ inputs.force_refresh || false }}
                  TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
                  TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
            - name: Fetch airport metro schedules
              id: metro
              continue-on-error: true
              run: npm run data:metro
              env:
                  TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
                  TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
            - run: npm run build
            - name: Save daily data, including explicit stale status
              id: save
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add public/data
                  if ! git diff --cached --quiet; then
                      git commit -m 'Update daily railway timetables'
                      git push origin HEAD:main
                  fi
                  echo "saved=true" >> "$GITHUB_OUTPUT"
            - name: Report upstream failure
              if: steps.fetch.outcome == 'failure' || steps.metro.outcome == 'failure'
              run: |
                  echo '部分上游班表取得失敗，已保留成功資料與舊資料標記。請查看更新紀錄。'
                  exit 1
    publish:
        needs: update
        if: always() && needs.update.outputs.saved == 'true'
        uses: ./.github/workflows/pages.yml
        secrets: inherit
