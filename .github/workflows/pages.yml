name: Publish website
on:
    push:
        branches: [main]
        paths-ignore: ['public/data/**']
    workflow_dispatch:
    workflow_call:
permissions:
    contents: read
    pages: write
    id-token: write
concurrency:
    group: pages
    cancel-in-progress: false
jobs:
    publish:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm test
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e
            - run: npm run build
              env:
                  BASE_PATH: /${{ github.event.repository.name }}/
                  VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID || 'G-DKH16N2ZM8' }}
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist
            - id: deployment
              uses: actions/deploy-pages@v4
