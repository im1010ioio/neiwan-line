name: Publish website
on:
    push:
        branches: [main]
        paths-ignore: ['public/data/**']
    workflow_dispatch:
    workflow_call:
permissions:
    contents: read
    pages: write
    id-token: write
concurrency:
    group: pages
    cancel-in-progress: false
jobs:
    publish:
        runs-on: ubuntu-latest
        env:
            PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
        environment:
            name: github-pages
            url: ${{ steps.retry_deployment.outputs.page_url || steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm test
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e
            - uses: actions/configure-pages@v5
              id: pages
            - run: npm run build
              env:
                  BASE_PATH: ${{ steps.pages.outputs.base_path }}/
                  VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID || 'G-DKH16N2ZM8' }}
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist
                  name: ${{ env.PAGES_ARTIFACT }}
            - id: deployment
              uses: actions/deploy-pages@v4
              continue-on-error: true
              with:
                  artifact_name: ${{ env.PAGES_ARTIFACT }}
            # deploy-pages sets page_url after creation, before checking deployment status.
            - name: Wait before retrying Pages deployment creation
              if: steps.deployment.outcome == 'failure' && !steps.deployment.outputs.page_url
              run: sleep 15
            - id: retry_deployment
              if: steps.deployment.outcome == 'failure' && !steps.deployment.outputs.page_url
              uses: actions/deploy-pages@v4
              with:
                  artifact_name: ${{ env.PAGES_ARTIFACT }}
            - name: Report failed Pages deployment
              if: steps.deployment.outcome == 'failure' && steps.deployment.outputs.page_url
              run: |
                  echo '::error::The existing Pages deployment failed. See the deployment log.'
                  exit 1
